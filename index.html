<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda UNL Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Pantalla de Bienvenida Estilo App -->
    <div id="login-screen" class="screen-full">
        <div class="welcome-box">
            <div class="logo">🌸</div>
            <h1>¡Hola!</h1>
            <p>Configura tu agenda universitaria</p>
            <div class="input-group">
                <input type="text" id="reg-name" placeholder="Escribe tu nombre">
                <input type="text" id="reg-curso" placeholder="Curso (Ej: 3ero)">
                <input type="text" id="reg-paralelo" placeholder="Paralelo (Ej: A)">
            </div>
            <button class="btn-primary" onclick="saveUser()">Comenzar Agenda</button>
        </div>
    </div>

    <!-- App Principal -->
    <div id="main-app" style="display:none;">
        <header class="app-header">
            <div class="profile">
                <span class="avatar">🏛️</span>
                <div class="text">
                    <h2 id="display-user-name">Usuario</h2>
                    <p id="display-user-details"></p>
                </div>
            </div>
            <div class="clock-section">
                <h1 id="clock">00:00</h1>
                <p id="date-display"></p>
            </div>
            <button class="fab-add" onclick="showModal()">+</button>
        </header>

        <main class="scroll-area">
            <div id="days-wrapper" class="days-grid">
                <!-- Se genera por JS -->
            </div>
            
            <div class="notes-card">
                <label>✎ Notas Rápidas</label>
                <textarea id="notes-area" placeholder="Escribe algo aquí..."></textarea>
            </div>
        </main>
    </div>

    <!-- Modal Moderno -->
    <div id="modal" class="modal-overlay">
        <div class="modal-sheet">
            <h3>Nueva Clase</h3>
            <input type="text" id="task-name" placeholder="Nombre de materia">
            <input type="time" id="task-time">
            <select id="task-day">
                <option value="Lunes">Lunes</option>
                <option value="Martes">Martes</option>
                <option value="Miercoles">Miércoles</option>
                <option value="Jueves">Jueves</option>
                <option value="Viernes">Viernes</option>
            </select>
            <div class="modal-actions">
                <button onclick="hideModal()" class="btn-sec">Cancelar</button>
                <button onclick="addTask()" class="btn-primary">Guardar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
