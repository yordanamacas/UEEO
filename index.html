<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Universitaria UNL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Pantalla de Registro/Bienvenida -->
    <div id="login-screen" class="login-container">
        <div class="login-card">
            <h1>🌸 Bienvenidos 🌸</h1>
            <p>Ingresa tus datos para empezar</p>
            <input type="text" id="reg-name" placeholder="Tu Nombre">
            <input type="text" id="reg-curso" placeholder="Curso (ej: 3ero)">
            <input type="text" id="reg-paralelo" placeholder="Paralelo (ej: A)">
            <button onclick="saveUser()">Entrar a mi Agenda</button>
        </div>
    </div>

    <!-- Contenido Principal (Oculto al inicio) -->
    <div id="main-app" class="main-container" style="display:none;">
        <header class="header">
            <div class="user-info">
                <span>🏛️</span>
                <p id="display-user-name">Usuario</p>
                <small id="display-user-details"></small>
            </div>
            <h1 id="clock">00:00:00</h1>
            <p id="date-display">Cargando fecha...</p>
            <div class="header-buttons">
                <button onclick="showModal()" class="btn-add">+</button>
                <button onclick="logout()" class="btn-icon">🚪</button>
            </div>
        </header>

        <section class="days-container" id="days-wrapper">
            <!-- Los días se generan con el script -->
        </section>

        <footer class="notes-section">
            <label>✎ Notas Personales</label>
            <textarea id="notes-area"></textarea>
        </footer>
    </div>

    <!-- Modal para Tareas -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3>Nueva Clase</h3>
            <input type="text" id="task-name" placeholder="Materia">
            <input type="time" id="task-time">
            <select id="task-day">
                <option value="Lunes">Lunes</option>
                <option value="Martes">Martes</option>
                <option value="Miercoles">Miércoles</option>
                <option value="Jueves">Jueves</option>
                <option value="Viernes">Viernes</option>
            </select>
            <div class="modal-footer">
                <button onclick="hideModal()">Cancelar</button>
                <button onclick="addTask()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
