<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title>Agenda Universitaria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PANTALLA 1: REGISTRO (Basado en tu imagen) -->
    <div id="pantalla-registro" class="registro-overlay">
        <div class="registro-card">
            <div class="icon-birrete">🎓</div>
            <h1>Registro de Estudiante</h1>
            <div class="form-group">
                <input type="text" id="nombre-usuario" placeholder="Nombre completo">
                <div class="input-row">
                    <input type="text" id="curso-usuario" placeholder="Curso">
                    <button class="btn-acceder" onclick="entrar()">Acceder al Sistema</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PANTALLA 2: HORARIO (Basado en tu imagen) -->
    <div id="pantalla-horario" class="main-app" style="display: none;">
        <header class="header-app">
            <div class="user-tag" id="tag-user">USUARIO</div>
            <h1 id="clock">00:00:00</h1>
            <div id="date-display">martes, 12 de mayo</div>
            <div class="btn-container">
                <button onclick="abrirModal()">➕ Agregar Materia</button>
                <button onclick="cerrarSesion()">🚪 Salir</button>
            </div>
        </header>

        <section class="days-container">
            <div class="day-column" id="Lunes"><div class="day-header">Lunes</div><div class="task-list"></div></div>
            <div class="day-column" id="Martes"><div class="day-header">Martes</div><div class="task-list"></div></div>
            <div class="day-column" id="Miércoles"><div class="day-header">Miércoles</div><div class="task-list"></div></div>
            <div class="day-column" id="Jueves"><div class="day-header">Jueves</div><div class="task-list"></div></div>
            <div class="day-column" id="Viernes"><div class="day-header">Viernes</div><div class="task-list"></div></div>
        </section>

        <footer class="notes-section">
            <label>✎ Bloc de Notas Dinámico (Auto-guardado)</label>
            <textarea id="notes-area" placeholder="Escribe tus pendientes aquí..."></textarea>
        </footer>
    </div>

    <!-- VENTANA PARA AGREGAR CLASES -->
    <div id="modal-tarea" class="modal">
        <div class="modal-content">
            <h3>Nueva Clase</h3>
            <input type="text" id="input-materia" placeholder="Materia">
            <input type="time" id="input-hora">
            <select id="input-dia">
                <option value="Lunes">Lunes</option>
                <option value="Martes">Martes</option>
                <option value="Miércoles">Miércoles</option>
                <option value="Jueves">Jueves</option>
                <option value="Viernes">Viernes</option>
            </select>
            <div class="modal-buttons">
                <button onclick="guardarClase()" class="btn-save">Guardar</button>
                <button onclick="cerrarModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
